<form
  class="redefinir-senha-page"
  [formGroup]="form"
  (ngSubmit)="redefinirSenha()"
>
  <div class="redefinir-senha-form">
    <div class="form-wrapper">
      <h1>Redefinir Senha</h1>
      <p class="subtitle">Informe seu e-mail e a nova senha.</p>

      <mat-form-field appearance="outline">
        <mat-label>E-mail</mat-label>
        <input matInput type="email" formControlName="email" autocomplete="email" />
        <mat-error *ngIf="form.controls.email.invalid">
          E-mail inválido
        </mat-error>
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Senha</mat-label>
        <input matInput type="password" formControlName="senha" />
        <mat-error *ngIf="form.controls.senha.invalid">
          Campo obrigatório
        </mat-error>
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Confirmar Senha</mat-label>
        <input matInput type="password" formControlName="confirmarSenha" />
        <mat-error *ngIf="form.controls.confirmarSenha.invalid">
          Campo obrigatório
        </mat-error>
      </mat-form-field>

      <button
        mat-raised-button
        color="primary"
        type="submit"
        [disabled]="form.invalid || loading"
      >
        {{ loading ? "Alterando..." : "Alterar" }}
      </button>
    </div>
  </div>

  <div class="redefinir-senha-image">
    <div class="overlay">
      <p>Agilidade, controle e precisão na expedição</p>
    </div>
  </div>
</form>
