<ng-container *ngIf="hideContainer$ | async">
  <router-outlet></router-outlet>
</ng-container>

<div class="app-layout" *ngIf="!(hideContainer$ | async)">

  <!-- Sidebar overlay — fica por cima do container -->
  <app-sidebar></app-sidebar>

  <!-- Container original intacto -->
  <div class="container">
    <router-outlet></router-outlet>
  </div>

</div>

<app-loading-overlay></app-loading-overlay>
